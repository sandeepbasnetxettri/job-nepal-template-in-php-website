<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile — JOB NEPAL</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇳🇵</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo" aria-label="Job Nepal Homepage">
        <svg class="brand-mountain-icon" viewBox="0 0 54 32" fill="none">
          <path d="M12 28L24 6L34 22L42 12L52 28H12Z" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 28L14 10L22 22" stroke="#0066FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 12L24 6L28 13" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text-wrap">
          <div class="brand-name">JOB <span>NEPAL</span></div>
          <div class="brand-tagline">Find Your Job. Build Your Future.</div>
        </div>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="jobs.html" class="nav-link">Find Jobs</a></li>
        <li><a href="companies.html" class="nav-link active">Companies</a></li>
        <li><a href="career.html" class="nav-link">Career</a></li>
        <li><a href="tech-learning.html" class="nav-link">Tech Learning</a></li>
        <li><a href="resume-builder.html" class="nav-link">Resume Builder</a></li>
      </ul>

      <div class="nav-actions">
        <button id="themeToggle" class="btn btn-ghost btn-sm" aria-label="Toggle dark/light mode">🌙</button>
        <a href="post-job.html" class="btn btn-crimson btn-sm">Post a Job</a>
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>

      <button class="mobile-toggle" aria-label="Open mobile navigation">☰</button>
    </div>
  </header>

  <!-- Company Details Container -->
  <main class="container" id="companyDetailsContainer" style="padding-top: 2.5rem; padding-bottom: 4rem;">
    <!-- Injected dynamically via JS -->
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>
        © 2026 JOB NEPAL — Find Your Job. Build Your Future.
      </div>
      <div>
        <a href="companies.html" style="color: #94a3b8; margin-right: 1.2rem;">All Companies</a>
        <a href="jobs.html" style="color: #94a3b8;">Find Jobs</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const companyId = params.get('id') || 'cotiviti-nepal';
      const company = window.JobNepalDB.getCompanyById(companyId) || window.JobNepalDB.getCompanies()[0];

      if (!company) return;

      document.title = `${company.name} — Profile & Vacancies | Job Nepal`;

      const allJobs = window.JobNepalDB.getJobs();
      const companyJobs = allJobs.filter(j => j.companyId === company.id || j.company.toLowerCase().includes(company.name.toLowerCase()));

      const container = document.getElementById('companyDetailsContainer');
      container.innerHTML = `
        <!-- Profile Banner -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.5rem; margin-bottom: 2rem;">
          <div style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
            <div class="company-avatar-large" style="width: 88px; height: 88px; font-size: 2rem;">
              ${company.logoText}
            </div>
            <div>
              <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                <span class="badge badge-nepal">Verified Employer</span>
                <span class="badge badge-indigo">${company.industry}</span>
                <span style="font-weight: 700; font-size: 0.9rem;">⭐ ${company.rating} / 5.0</span>
              </div>
              <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 4px;">${company.name}</h1>
              <div style="color: var(--text-muted); font-size: 1.05rem;">${company.tagline}</div>
              <div style="font-size: 0.9rem; color: var(--text-muted); margin-top: 6px;">
                📍 ${company.location} • 🌐 <a href="${company.website}" target="_blank" rel="noopener">${company.website}</a>
              </div>
            </div>
          </div>
        </div>

        <div class="details-layout">
          <!-- Main Content -->
          <div>
            <div class="details-main-card" style="margin-bottom: 2rem;">
              <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 1rem;">About ${company.name}</h2>
              <p style="color: var(--text-muted); line-height: 1.7; font-size: 1rem; margin-bottom: 1.5rem;">
                ${company.description}
              </p>

              <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem;">Company Highlights</h3>
              <ul style="padding-left: 1.25rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 0.5rem;">
                <li>Active technical squads with continuous learning & certification sponsorships</li>
                <li>Comprehensive insurance benefits adhering to Nepal Labor Act 2074</li>
                <li>Modern engineering culture with code reviews, CI/CD, and agile workflows</li>
              </ul>
            </div>

            <!-- Available Jobs -->
            <div class="details-main-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="font-size: 1.4rem; font-weight: 800;">Available Vacancies (${companyJobs.length})</h2>
                <a href="jobs.html?q=${encodeURIComponent(company.name)}" class="btn btn-outline btn-sm">Filter in Search</a>
              </div>

              ${companyJobs.length === 0 ? `
                <p style="color: var(--text-muted); text-align: center; padding: 2rem;">No vacancies currently open for this company.</p>
              ` : `
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                  ${companyJobs.map(job => `
                    <div style="border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                      <div>
                        <h4 style="font-size: 1.1rem; font-weight: 700;"><a href="job-details.html?id=${job.id}">${job.title}</a></h4>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">${job.location} • ${job.jobType} • ${job.experience}</div>
                        <div style="font-size: 0.95rem; font-weight: 700; color: #047857; margin-top: 4px;">${job.salaryFormatted}</div>
                      </div>
                      <a href="job-details.html?id=${job.id}" class="btn btn-primary btn-sm">View & Apply</a>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Reviews Section -->
            <div class="details-main-card" style="margin-top: 2rem;">
              <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 1rem;">Employee Reviews</h2>
              <div style="background: var(--bg-subtle); padding: 1.2rem; border-radius: var(--radius-md); margin-bottom: 1rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                  <strong>Software Engineer in Kathmandu</strong>
                  <span style="color: var(--warning);">⭐⭐⭐⭐⭐ (5.0)</span>
                </div>
                <p style="font-size: 0.88rem; color: var(--text-muted);">
                  "Exceptional engineering culture. Transparent management, timely Dashain bonus, and flexible hybrid options for developers."
                </p>
              </div>
            </div>
          </div>

          <!-- Sidebar Contact Info -->
          <div>
            <div class="details-sidebar-card">
              <h3 style="font-size: 1.15rem; font-weight: 700;">Recruitment Office</h3>
              <div style="font-size: 0.9rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 0.75rem;">
                <div><strong>Email:</strong><br>${company.contact ? company.contact.email : 'hr@example.com'}</div>
                <div><strong>Phone:</strong><br>${company.contact ? company.contact.phone : '+977-1-4400000'}</div>
                <div><strong>Office:</strong><br>${company.location}</div>
                <div><strong>PAN / Reg:</strong><br>Nepal Verified Entity</div>
              </div>
              <hr style="border: none; border-top: 1px solid var(--border-color);">
              <a href="post-job.html" class="btn btn-crimson btn-sm" style="text-align: center;">Are you an employer? Post a vacancy</a>
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
