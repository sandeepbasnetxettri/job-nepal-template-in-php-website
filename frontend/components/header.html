<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Navigation Bar — JOB NEPAL</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇳🇵</text></svg>">
</head>

<body>

  <header class="site-header">
    <div class="container navbar">
      <!-- Exact Logo: Mountain Peaks + Job Nepal + Slogan -->
      <a href="../index.html" class="brand-logo" aria-label="Job Nepal Homepage">
        <svg class="brand-mountain-icon" viewBox="0 0 54 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 28L24 6L34 22L42 12L52 28H12Z" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M2 28L14 10L22 22" stroke="#0066FF" stroke-width="3" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M21 12L24 6L28 13" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <div class="brand-text-wrap">
          <div class="brand-name">JOB <span>NEPAL</span></div>
          <div class="brand-tagline">Find Your Job. Build Your Future.</div>
        </div>
      </a>

      <!-- Center Nav Links -->
      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link"><span>🏠</span> Home</a></li>
        <li><a href="../jobs.html" class="nav-link"><span>🔍</span> Find Jobs</a></li>
        <li><a href="../companies.html" class="nav-link"><span>🏢</span> Companies</a></li>
        <li><a href="../career.html" class="nav-link"><span>📖</span> Career</a></li>
        <li><a href="../post-job.html" class="nav-link"><span>💼</span> Post a Job</a></li>
      </ul>

      <!-- Right Actions: Login, Register, Nepal Country Pill -->
      <div class="nav-actions">
        <a href="../login.html" class="btn btn-outline btn-sm">Login</a>
        <a href="../register.html" class="btn btn-primary btn-sm">Register</a>
        <div class="country-pill-dropdown">
          <button id="countryDropdownBtn" class="country-pill" aria-label="Select Country" aria-expanded="false"
            onclick="toggleCountryDropdown(event)">
            <span id="currentCountryFlag">🇳🇵</span> <span id="currentCountryName">Nepal</span> ▾
          </button>
          <div id="countryDropdownMenu" class="country-dropdown-menu">
            <div class="country-dropdown-header">
              <span style="font-weight: 700; font-size: 0.85rem; color: var(--text-main);">Select Region /
                Country</span>
            </div>
            <div class="country-search-box">
              <input type="text" id="countrySearchInput" placeholder="🔍 Search country..."
                oninput="filterCountries(this.value)">
            </div>
            <div class="country-list" id="countryList">
              <!-- Country options rendered via app.js -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
